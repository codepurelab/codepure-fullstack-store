version: '3.8'

services:
  api:
    build: .
    # FIX: Removed privileged and host network
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=appuser
      - NODE_ENV=production
    # FIX: No host filesystem mounts
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ecommerce_prod
      MYSQL_USER: appuser
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    # FIX: Require password, bind to internal
    command: redis-server --requirepass "${REDIS_PASSWORD}" --bind 127.0.0.1
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  app-data:
  mysql-data:
