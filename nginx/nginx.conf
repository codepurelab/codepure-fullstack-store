worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # VULN: Server tokens exposed
    server_tokens on;

    # VULN: Missing security headers
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # VULN: Directory listing enabled
        location /uploads {
            autoindex on;
            alias /app/uploads/;
        }

        # VULN: Exposing debug endpoint
        location /debug {
            proxy_pass http://localhost:9229;
        }
    }
}
