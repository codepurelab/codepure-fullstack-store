apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      # VULN: No securityContext - runs as root
      containers:
        - name: api
          image: ecommerce-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_PASSWORD
              value: "Pr0duction_DB_P@ssw0rd!2024"
            - name: JWT_SECRET
              value: "super-secret-jwt-key-2024-production"
          # VULN: No resource limits
          volumeMounts:
            - name: host-volume
              mountPath: /host-data
            - name: docker-socket
              mountPath: /var/run/docker.sock
          # VULN: Privileged security context
          securityContext:
            privileged: true
            runAsUser: 0
      volumes:
        # VULN: hostPath mount
        - name: host-volume
          hostPath:
            path: /
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-api-svc
spec:
  type: NodePort
  ports:
    - port: 3000
      nodePort: 30080
  selector:
    app: ecommerce-api
